name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  renovate-config-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: npx --yes --package renovate@latest renovate-config-validator --strict default.json

permissions:
  contents: read
