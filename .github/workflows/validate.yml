name: validate

on:
  push:
    branches: [main]
  pull_request:
  # 定时跑,用来发现上游 schema / validator 的 breaking 变更
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate-config-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0
      # 钉死版本:用 latest 的话上游发个 breaking 变更,CI 会在没人改代码的情况下红。
      # 想升级时手动改这里,顺手过一遍 diff。
      - run: npx --yes --package renovate@44.115.13 renovate-config-validator --strict default.json

permissions:
  contents: read
